coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  rust:
    paths:
      - crates/core
      - src-tauri
  frontend:
    paths:
      - src

ignore:
  - "src-tauri/gen/**"
  - "scripts/**"
  - "src/**/__tests__/**"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
